spring.application.name=CadastroDeNinja

# h2
spring.datasource.url=jdbc:h2:file:./data/ninjadb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false


# jdbc:h2:file:./data/ninjadb	Guarda os dados em arquivos na pasta data do projeto
# username=sa	Usuário padrão do banco H2
# password=	Senha vazia para nosso ambiente local de estudo
# ddl-auto=update	Permite ao Hibernate atualizar a estrutura das tabelas conforme as entidades
# show-sql=true	Mostra comandos SQL no terminal
# open-in-view=false	Desativa o padrão Open EntityManager in View